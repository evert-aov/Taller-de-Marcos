<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-badge-icon">
        <ng-icon name="heroLockClosed" size="36"></ng-icon>
      </div>
      <h2>Panel Administrativo</h2>
      <p>Catálogo de Marcos de Madera Fina</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">
        <ng-icon name="heroExclamationTriangle" size="18"></ng-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="admin@taller.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="demo-box">
        <div class="demo-info">
          <strong>Credenciales por defecto:</strong>
          <code>admin@taller.com</code> / <code>admin123</code>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" (click)="fillDemo()">
          Autocompletar
        </button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
          <span>Ingresando...</span>
        } @else {
          <ng-icon name="heroArrowRightOnRectangle" size="18"></ng-icon>
          <span>Iniciar Sesión</span>
        }
      </button>

      <div class="back-link">
        <a routerLink="/" class="btn-link">
          <ng-icon name="heroArrowLeft" size="16"></ng-icon>
          <span>Volver al Catálogo Público</span>
        </a>
      </div>
    </form>
  </div>
</div>
